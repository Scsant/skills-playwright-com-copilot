        - heading "Built for testing" [level=2] [ref=f3e70]
        - generic [ref=f3e72]:
          - generic [ref=f3e73]:
            - heading "Auto-wait and web-first assertions" [level=4] [ref=f3e74]
            - paragraph [ref=f3e75]: Playwright waits for elements to be actionable before performing actions. Assertions automatically retry until conditions are met. No artificial timeouts, no flaky tests.
            - heading "Test isolation" [level=4] [ref=f3e76]
            - paragraph [ref=f3e77]: Each test gets a fresh browser context — equivalent to a brand new browser profile. Full isolation with near-zero overhead. Save authentication state once and reuse it across tests.
          - generic [ref=f3e78]:
            - heading "Resilient locators" [level=4] [ref=f3e79]
            - paragraph [ref=f3e80]:
              - text: "Find elements with selectors that mirror how users see the page:"
              - code [ref=f3e81]: getByRole
              - text: ","
              - code [ref=f3e82]: getByLabel
              - text: ","
              - code [ref=f3e83]: getByPlaceholder
              - text: ","
              - code [ref=f3e84]: getByTestId
              - text: . No brittle CSS paths.
            - heading "Parallelism and sharding" [level=4] [ref=f3e85]
            - paragraph [ref=f3e86]: Tests run in parallel by default across all configured browsers. Shard across multiple machines for faster CI. Full cross-browser coverage on every commit.
      - generic [ref=f3e88]:
