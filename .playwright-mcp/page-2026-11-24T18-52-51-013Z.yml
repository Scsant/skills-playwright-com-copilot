          - heading "Playwright Test" [level=3] [ref=f3e51]
          - paragraph [ref=f3e52]: Full-featured test runner with auto-waiting, assertions, tracing, and parallelism across Chromium, Firefox, and WebKit.
          - code [ref=f3e53]: npm init playwright@latest
          - link "Testing documentation" [ref=f3e55] [cursor=pointer]:
            - /url: /docs/intro
        - generic [ref=f3e56]:
          - heading "Playwright CLI" [level=3] [ref=f3e57]
          - paragraph [ref=f3e58]: Token-efficient browser automation for coding agents like Claude Code and GitHub Copilot. Skill-based workflows without large context overhead.
          - code [ref=f3e59]: npm i -g @playwright/cli@latest
          - link "CLI documentation" [ref=f3e61] [cursor=pointer]:
            - /url: /docs/getting-started-cli
        - generic [ref=f3e62]:
          - heading "Playwright MCP" [level=3] [ref=f3e63]
          - paragraph [ref=f3e64]: Model Context Protocol server that gives AI agents full browser control through structured accessibility snapshots.
          - code [ref=f3e65]: npx @playwright/mcp@latest
          - link "MCP documentation" [ref=f3e67] [cursor=pointer]:
            - /url: /docs/getting-started-mcp
